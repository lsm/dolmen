name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  sidecar:
    name: dolmen-duckdb ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-14
          - platform: windows-amd64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build and package the SQL sidecar
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS_NO_PATHCONV: "1"
        run: sidecar/duckdb/package.sh "${{ matrix.platform }}" "${{ github.ref_name }}" sidecar-dist

      - uses: actions/upload-artifact@v4
        with:
          name: dolmen-duckdb-${{ matrix.platform }}
          path: sidecar-dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve model release tag
        id: models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(make -s model-release)"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "MODEL_RELEASE is $tag but no release is published under that tag, so this release's model links would 404; push the $tag tag (or run the release-models workflow), then re-run this job" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vulnerability gate
        run: CGO_ENABLED=0 govulncheck ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Build release binaries
        run: make release VERSION=${{ github.ref_name }}

      - name: Add the SQL sidecar bundles
        uses: actions/download-artifact@v4
        with:
          pattern: dolmen-duckdb-*
          path: dist
          merge-multiple: true

      - name: Resolve the pinned DuckDB version
        id: duckdb
        run: echo "version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' sidecar/duckdb/fetch-deps.sh)" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/dolmen-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: make release-checksums

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine container tags
        id: tags
        run: |
          ref="${{ github.ref_name }}"
          repo="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            echo "${repo}:${ref}"
            if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${repo}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_final=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Pre-packaged embedding models for offline or Hugging-Face-blocked installs are not attached here. They change far less often than dolmen does, so they are published once under their own tag and shared by every release — this one uses [`${{ steps.models.outputs.tag }}`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.models.outputs.tag }}):

            - [`dolmen-model-all-MiniLM-L6-v2.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.models.outputs.tag }}/dolmen-model-all-MiniLM-L6-v2.tar.gz) — the default English model (`sentence-transformers/all-MiniLM-L6-v2`, ~90 MB).
            - [`dolmen-model-multilingual-e5-small.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.models.outputs.tag }}/dolmen-model-multilingual-e5-small.tar.gz) — the multilingual/CJK model (`intfloat/multilingual-e5-small`, ~270 MB compressed).

            See the README's "Offline install" and "Choosing an embedding model" sections.

            The `dolmen-duckdb-*` bundles are the SQL sidecar for `-engine lakehouse`; unpack one beside the `dolmen` binary (see `docs/lakehouse-operations.md`). Each carries DuckDB ${{ steps.duckdb.outputs.version }}'s prebuilt library and its `iceberg` and `httpfs` extensions, fetched at pinned SHA-256 digests. The SBOM attached here describes the Go module graph only and does not list those DuckDB components, and the container image does not include the sidecar.
          generate_release_notes: true
          prerelease: ${{ steps.tags.outputs.is_final != 'true' }}
          make_latest: ${{ steps.tags.outputs.is_final }}

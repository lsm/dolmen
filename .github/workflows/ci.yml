# Minimal CI: vet, the race-enabled test suite (which includes the
# contract-conformance suite), the zero-comments gate (#231), and the
# CGO_ENABLED=0 build that keeps the shipped binary cgo-free.
# Releases, container builds, SBOM, and the vulnerability gate are
# deliberately out of scope here — see #68.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: CGO_ENABLED=1 go test -race ./...
      - name: Build and run external-module example
        run: |
          cd examples/basic
          go build ./...
          go vet ./...
          go run .

  cgo-free-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build with cgo disabled
        run: CGO_ENABLED=0 go build ./...
      - name: Vet with cgo disabled
        run: CGO_ENABLED=0 go vet ./...

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Namespace files, WAL, concurrency, auth registry, shutdown; the binary end to end on macOS
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then export TMPDIR="$(cd "${RUNNER_TEMP}" && pwd -P)"; fi
          pkgs="./internal/store ./internal/auth ./cmd/dolmen"
          if [ "$(uname -s)" = Darwin ]; then pkgs="$pkgs ./internal/blackbox"; fi
          go test -count=1 $pkgs

  no-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check no comments
        run: go run github.com/lsm/nocomment-for-agents/go@016ad219e84b9b78ca66ff1b66a7729218030c12 --check

  inprocess-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/inprocess
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build with cgo disabled
        run: CGO_ENABLED=0 go build ./...
      - name: Vet with cgo disabled
        run: CGO_ENABLED=0 go vet ./...
      - name: Vulnerability gate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Confinement, type mapping and scan tests
        run: go test -count=1 -shuffle=on -v ./...
      - name: Check no comments
        working-directory: .
        run: go run github.com/lsm/nocomment-for-agents/go@016ad219e84b9b78ca66ff1b66a7729218030c12 --check
      - name: Binary size cost
        run: |
          set -eu
          CGO_ENABLED=0 go build -trimpath -o size-empty ./cmd/empty
          CGO_ENABLED=0 go build -trimpath -o size-gms ./cmd/size
          e=$(stat -c %s size-empty); g=$(stat -c %s size-gms)
          echo "empty binary:        $e"
          echo "with go-mysql-server: $g"
          echo "delta:               $((g - e)) bytes ($(( (g - e) / 1048576 )) MiB)"
      - name: Query timings
        run: go test -count=1 -run XXX -bench . -benchtime 20x .

  duckdb-lockdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download the pinned DuckDB CLI and verify its checksum
        run: |
          set -eu
          dest="$RUNNER_TEMP/duckdb"
          ASSET=duckdb_cli-linux-amd64.zip internal/duckdblockdown/fetch-duckdb.sh "$dest"
          unzip -q -o "$dest/duckdb_cli-linux-amd64.zip" -d "$dest"
          chmod +x "$dest/duckdb"
          "$dest/duckdb" --version
      - name: Attack the locked engine
        env:
          DOLMEN_TEST_DUCKDB: ${{ runner.temp }}/duckdb/duckdb
        run: go test -count=1 -v ./internal/duckdblockdown

  sidecar-duckdb:
    runs-on: ubuntu-latest
    env:
      DOLMEN_DUCKDB_PLATFORM: linux_amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: spike/driver/go.mod
      - name: Build the DuckDB sidecar against the prebuilt library
        working-directory: spike/sidecar-duckdb
        run: |
          set -eu
          dest="$RUNNER_TEMP/ddb"
          ../fetch-sidecar-deps.sh lib libduckdb-linux-amd64.zip "$dest"
          ../fetch-sidecar-deps.sh ext "$DOLMEN_DUCKDB_PLATFORM" "$dest/ext"
          ls -la "$dest/ext"
          start=$(date +%s)
          g++ -std=c++17 -O2 -I"$dest" sidecar.cpp -L"$dest" -lduckdb -Wl,-rpath,"$dest" -o "$dest/sidecar"
          echo "build seconds: $(( $(date +%s) - start ))"
      - name: Record the DuckDB sidecar packaging facts
        working-directory: spike/sidecar-duckdb
        run: |
          set -eu
          dest="$RUNNER_TEMP/ddb"
          echo "PACKAGING engine=duckdb binary_bytes=$(stat -c %s "$dest/sidecar")"
          echo "PACKAGING engine=duckdb libduckdb_bytes=$(stat -c %s "$dest/libduckdb.so")"
          echo "PACKAGING engine=duckdb iceberg_bytes=$(stat -c %s "$dest/ext/iceberg.duckdb_extension")"
          echo "PACKAGING engine=duckdb httpfs_bytes=$(stat -c %s "$dest/ext/httpfs.duckdb_extension")"
          if ldd "$dest/sidecar" | grep -qv 'linux-vdso\|ld-linux\|libstdc++\|libm.so\|libgcc_s\|libc.so'; then
            echo "PACKAGING engine=duckdb linux_static=no unexpected=$(ldd "$dest/sidecar" | tr '\n' ' ')"
          else
            echo "PACKAGING engine=duckdb linux_static=yes"
          fi
          "$dest/sidecar" 2>&1 | head -1 || true
      - name: Read-back, confinement, lifecycle and packaging tests
        working-directory: spike/driver
        env:
          SIDECAR_BIN: ${{ runner.temp }}/ddb/sidecar
          SIDECAR_ENGINE: duckdb
          SIDECAR_EXT_DIR: ${{ runner.temp }}/ddb/ext
        run: go test -count=1 -v -timeout 40m ./...
      - name: Check no comments
        working-directory: .
        run: go run github.com/lsm/nocomment-for-agents/go@016ad219e84b9b78ca66ff1b66a7729218030c12 --check
      - name: Perf set on a 10M row table
        working-directory: spike/driver
        env:
          SIDECAR_BIN: ${{ runner.temp }}/ddb/sidecar
          SIDECAR_ENGINE: duckdb
          SIDECAR_EXT_DIR: ${{ runner.temp }}/ddb/ext
          DOLMEN_SPIKE_PERF: "1"
        run: go test -count=1 -v -timeout 60m -run 'Perf|FirstQueryQuickly' ./...

  sidecar-packaging:
    name: sidecar packaging ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            ext: linux_amd64
            asset: libduckdb-linux-amd64.zip
            static_asset: libduckdb-linux-amd64-musl.zip
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            ext: linux_arm64
            asset: libduckdb-linux-arm64.zip
            static_asset: libduckdb-linux-arm64-musl.zip
          - platform: darwin-arm64
            runner: macos-14
            ext: osx_arm64
            asset: libduckdb-osx-universal.zip
            static_asset: ""
          - platform: windows-amd64
            runner: windows-latest
            ext: windows_amd64
            asset: libduckdb-windows-amd64.zip
            static_asset: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: spike/driver/go.mod
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Fetch the DuckDB library and the extensions that must be pre-placed
        shell: bash
        run: |
          set -eu
          dest="$RUNNER_TEMP/ddb"
          spike/fetch-sidecar-deps.sh lib "${{ matrix.asset }}" "$dest"
          spike/fetch-sidecar-deps.sh ext "${{ matrix.ext }}" "$dest/ext"
          ls "$dest" "$dest/ext"
      - name: Record the extension sizes and that they are pre-placed rather than downloaded
        shell: bash
        run: |
          set -eu
          dest="$RUNNER_TEMP/ddb"
          for ext in iceberg httpfs; do
            f="$dest/ext/$ext.duckdb_extension"
            if [ "$(uname -s)" = Darwin ]; then
              echo "PACKAGING platform=${{ matrix.platform }} ext=$ext bytes=$(stat -f %z "$f")"
            else
              echo "PACKAGING platform=${{ matrix.platform }} ext=$ext bytes=$(stat -c %s "$f")"
            fi
          done
      - name: Build and measure the DuckDB sidecar
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS_NO_PATHCONV: "1"
        run: |
          set -eu
          dest="$RUNNER_TEMP/ddb"
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Windows" ]; then
            cl /nologo /std:c++17 /EHsc /O2 "/I$dest" "/Fe:$dest/sidecar.exe" spike/sidecar-duckdb/sidecar.cpp "$dest/duckdb.lib" /link "/LIBPATH:$dest"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            c++ -std=c++17 -O2 -I"$dest" spike/sidecar-duckdb/sidecar.cpp -L"$dest" -lduckdb -Wl,-rpath,"$dest" -o "$dest/sidecar"
          else
            g++ -std=c++17 -O2 -I"$dest" spike/sidecar-duckdb/sidecar.cpp -L"$dest" -lduckdb -Wl,-rpath,"$dest" -o "$dest/sidecar"
          fi
          echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb build_seconds=$(( $(date +%s) - start ))"
          if [ "$(uname -s)" = Darwin ]; then
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb binary_bytes=$(stat -f %z "$dest/sidecar")"
          else
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb binary_bytes=$(stat -c %s "$dest/sidecar")"
          fi
      - name: Record whether the Linux DuckDB sidecar is fully static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dest="$RUNNER_TEMP/ddb"
          if [ -z "${{ matrix.static_asset }}" ]; then
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb static_lib=absent linux_static=unknown"
            exit 0
          fi
          spike/fetch-sidecar-deps.sh lib "${{ matrix.static_asset }}" "$dest/static"
          echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb static_lib_bytes=$(stat -c %s "$dest/static/libduckdb_static.a")"
          start=$(date +%s)
          if g++ -std=c++17 -O2 -static -I"$dest/static" spike/sidecar-duckdb/sidecar.cpp \
            "$dest/static/libduckdb_static.a" -ldl -lpthread -lm -o "$dest/sidecar-static" \
            2>"$dest/static-link.log"; then
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb static_build_seconds=$(( $(date +%s) - start ))"
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb static_binary_bytes=$(stat -c %s "$dest/sidecar-static")"
            if ldd "$dest/sidecar-static" 2>&1 | grep -q 'not a dynamic executable\|statically linked'; then
              echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb linux_static=yes"
            else
              echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb linux_static=no dynamic=$(ldd "$dest/sidecar-static" | tr '\n' ' ')"
            fi
          else
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb static_build_seconds=$(( $(date +%s) - start ))"
            echo "PACKAGING platform=${{ matrix.platform }} engine=duckdb linux_static=no static_link=failed"
            grep -oE "undefined reference to \`[^']+'" "$dest/static-link.log" | sort -u | sed 's/^/PACKAGING platform='"${{ matrix.platform }}"' engine=duckdb static_undefined=/' || true
          fi

  lakehouse-foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Package the dolmen-duckdb release bundle and unpack it where the tests read it
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS_NO_PATHCONV: "1"
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) platform=linux-amd64 bin=dolmen-duckdb ;;
            macOS) platform=darwin-arm64 bin=dolmen-duckdb ;;
            Windows) platform=windows-amd64 bin=dolmen-duckdb.exe ;;
          esac
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          sidecar/duckdb/package.sh "$platform" ci "$temp/bundle"
          tar -C "$temp" -xzf "$temp/bundle/dolmen-duckdb-ci-$platform.tar.gz"
          dest="$RUNNER_TEMP/dolmen-duckdb-ci-$platform"
          {
            echo "DOLMEN_TEST_DUCKDB_SIDECAR=$dest/$bin"
            echo "DOLMEN_TEST_DUCKDB_EXTENSIONS=$dest/duckdb-extensions"
            echo "DOLMEN_TEST_DUCKDB_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - name: Catalog persistence, isolation, pins, appends, SQL and concurrent lifecycle
        run: go test -race -count=1 ./internal/lakehouse
      - name: Shared SQLite and lakehouse conformance
        run: go test -race -count=1 ./internal/conformance -run '^TestLakehouse'
      - name: The full conformance suite on the lakehouse engine
        if: runner.os == 'Linux'
        env:
          DOLMEN_ENGINE: lakehouse
        run: go test -race -count=1 -timeout 30m ./internal/conformance
      - name: The packaged binary on the lakehouse engine
        if: runner.os == 'Linux'
        env:
          DOLMEN_ENGINE: lakehouse
        run: go test -count=1 ./internal/blackbox

  postgres-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dolmen
          POSTGRES_PASSWORD: dolmen-test
          POSTGRES_DB: dolmen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolmen -d dolmen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOLMEN_TEST_PG_DSN: postgres://dolmen_backend:backend-test@127.0.0.1:5432/dolmen_test?sslmode=disable
      DOLMEN_TEST_PG_REQUIRED: "1"
      DOLMEN_TEST_PG_QUERY_ROLE: dolmen_query
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create restricted query and backend roles
        env:
          PGPASSWORD: dolmen-test
        run: >-
          psql -h 127.0.0.1 -U dolmen -d dolmen_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE dolmen_query NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; CREATE ROLE dolmen_backend LOGIN PASSWORD 'backend-test'; GRANT dolmen_query TO dolmen_backend WITH INHERIT FALSE, SET TRUE; GRANT CONNECT, CREATE ON DATABASE dolmen_test TO dolmen_backend;"
      - name: PostgreSQL lifecycle and cross-process transaction tests
        run: go test -race -count=1 ./internal/postgres
      - name: Shared namespace and table contracts on both backends
        run: go test -race -count=1 ./internal/conformance -run 'BackendConformance$'
      - name: Full conformance matrix on PostgreSQL
        env:
          DOLMEN_ENGINE: postgres
        run: go test -race -count=1 ./internal/conformance
      - name: Packaged binary end to end on PostgreSQL
        env:
          DOLMEN_ENGINE: postgres
        run: go test -race -count=1 ./internal/blackbox

# Minimal CI: vet plus the race-enabled test suite (which includes the
# contract-conformance suite). Releases, container builds, SBOM, and the
# vulnerability gate are deliberately out of scope here — see #68.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

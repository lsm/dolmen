[package]
name = "sidecar-datafusion"
version = "0.1.0"
edition = "2021"

# datafusion is pinned to exactly the version iceberg-datafusion depends on,
# so the Arrow crates in the graph are one version rather than several. Take
# this from iceberg-datafusion's own Cargo.toml rather than picking one.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "fs", "sync"] }
datafusion = "53.1.0"
iceberg = "0.10.1"
iceberg-datafusion = "0.10.1"
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
strip = true
codegen-units = 16
